[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polaralign"
version = "0.1.0"
description = "Automatic polar-alignment base controller: plate solving, stepper motion, closed loop, web UI and simulator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "All rights reserved (licence not yet chosen)" }
dependencies = [
    "numpy>=1.24,<2",      # <2: cedar-solve 0.5.1 breaks on numpy 2 (verified); Pi OS Bookworm apt ships 1.24
    "scipy>=1.10",         # Pi OS Bookworm apt ships 1.10
    "pillow",                # NB cedar-solve 0.5.1 pins Pillow<9; on the Pi install it with --no-deps (see README)
    "cedar-solve>=0.5.1",   # Apache-2.0 plate solver (tetra3 fork). NOT cedar-detect (FSL).
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "smbus2>=0.4",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# Pi: lgpio and picamera2 are installed from apt (python3-lgpio, python3-picamera2) and the
# venv is created with --system-site-packages.  See README.
pi = ["lgpio"]
dev = ["pytest>=8", "httpx>=0.27", "pyerfa>=2.0"]

[project.scripts]
polaralign = "polaralign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polaralign = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end simulator runs (tens of seconds)",
]
